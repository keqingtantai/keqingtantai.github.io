<style>
/* ================= 全局 ================= */
*{box-sizing:border-box}
:root{ --barh:64px; --accent:#A93427; }
html{scroll-behavior:smooth}
body{margin:0;overflow-x:hidden;background:#FFFFFF;
     padding-bottom:var(--barh);
     transition:background .45s ease;
     font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}

/* ================= 竖向长页：每节 16:9 顺序堆叠 ================= */
.dk-slide{position:relative;display:block;width:100%;
     aspect-ratio:16/9;background:var(--bg,#FFFFFF);overflow:hidden}

/* ================= 底部控制条 ================= */
.dk-bar{position:fixed;left:0;right:0;bottom:0;height:var(--barh);
     display:flex;align-items:center;justify-content:center;gap:26px;
     padding:0 30px;user-select:none;z-index:10;
     background:var(--bar-bg,#FFFFFF);border-top:1px solid var(--line);
     transition:background .45s ease,border-color .45s ease}
body[data-theme="dark"]  .dk-bar{--fg:rgba(235,217,210,.52);--fg-on:#EBD9D2;--line:rgba(235,217,210,.15)}
body[data-theme="light"] .dk-bar{--fg:rgba(56,27,21,.48);  --fg-on:#381B15;--line:rgba(56,27,21,.13)}

.dk-bar button{appearance:none;background:none;border:0;padding:0;margin:0;cursor:pointer;
            color:var(--fg);transition:color .22s ease}
.dk-bar button:hover{color:var(--fg-on)}
.dk-bar button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.dk-bar button:disabled{opacity:.28;cursor:default}

/* 返回作品集 */
.dk-back{position:absolute;left:30px;top:50%;transform:translateY(-50%);
      color:var(--fg);text-decoration:none;white-space:nowrap;
      font:500 12px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.13em;
      transition:color .22s ease}
.dk-back:hover{color:var(--fg-on)}
.dk-back:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.dk-arrow{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;
       transition:color .22s ease,border-color .22s ease}
.dk-arrow:hover:not(:disabled){border-color:var(--accent)}
.dk-arrow svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;
           stroke-linecap:round;stroke-linejoin:round}

.dk-ticks{display:flex;align-items:center;gap:9px;margin:0;padding:0;list-style:none}
.dk-ticks button{display:block;height:16px;padding:0;width:18px;position:relative}
.dk-ticks button::after{content:"";position:absolute;left:0;right:0;top:7px;height:2px;
  background:currentColor;opacity:.5;transition:opacity .25s ease}
.dk-ticks button:hover::after{opacity:1}
.dk-ticks button[aria-current="true"]{width:38px;color:var(--accent)}
.dk-ticks button[aria-current="true"]::after{opacity:1}

.dk-meta{display:flex;align-items:baseline;gap:11px;color:var(--fg);white-space:nowrap;
      font:500 12px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.13em}
.dk-meta .dk-num{color:var(--fg-on);font-weight:600}
.dk-meta .dk-sep{opacity:.45}

.dk-tools{display:flex;align-items:center;gap:16px}
.dk-tools button{width:26px;height:26px;display:grid;place-items:center}
.dk-tools svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;
           stroke-linecap:round;stroke-linejoin:round}

@media (max-width:1080px){
  .dk-back{position:static;transform:none;order:-1}
  .dk-bar{gap:18px;padding:0 16px;justify-content:space-between}
}
@media (max-width:880px){
  .dk-bar{gap:14px;padding:0 12px}
  .dk-ticks{gap:7px}
  .dk-meta{display:none}
}
@media (max-height:560px){ :root{--barh:52px} }
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} body,.dk-bar{transition:none} }
</style>

@media (prefers-reduced-motion:reduce){#slide-1 .play .wire,#slide-1 .play #p1-p-top,#slide-1 .play #p1-p-num,#slide-1 .play #p1-p-bars,#slide-1 .play .toRed,#slide-1 .play #p1-eyebrow,#slide-1 .play #p1-headline,#slide-1 .play #p1-body{animation:none!important}#slide-1 .wire{opacity:0}}

  [].slice.call(__ROOT.querySelectorAll('.hit')).forEach(function(el){
    var i = el.getAttribute('data-i');
    function on(){
      page.classList.remove('hv0','hv1','hv2','hv3','hv4','hv5');
      page.classList.add('hv','hv'+i);
    }
    function off(){ page.classList.remove('hv','hv'+i); }
    el.addEventListener('mouseenter',on);
    el.addEventListener('mouseleave',off);
    el.addEventListener('focus',on);
    el.addEventListener('blur',off);
  });
})();

})();
(function(){
var __ROOT=document.getElementById("slide-4");
var __$=function(id){return __ROOT.querySelector("#p4-"+id);};

(function(){
  var page=__$('page');
  [['hitD','openD'],['hitR','openR']].forEach(function(p){
    var el=__$(p[0]);
    function toggle(){ page.classList.toggle(p[1]); }
    el.addEventListener('click',toggle);
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); }
    });
  });
})();

})();
</script>

<script>
(function(){
  var META = [{"label": "开篇", "theme": "dark", "bg": "#1B0F0B"}, {"label": "一形三读", "theme": "light", "bg": "#FAF8F5"}, {"label": "结构演化", "theme": "light", "bg": "#FAF8F5"}, {"label": "标志展示与应用", "theme": "light", "bg": "#FFFFFF"}];
  var slides = [].slice.call(document.querySelectorAll('.dk-slide'));
  var N = slides.length, cur = -1;

  var ticks = document.getElementById('ticks');
  META.forEach(function(m,i){
    var li = document.createElement('li');
    var b  = document.createElement('button');
    b.setAttribute('aria-label', '第 ' + (i+1) + ' 节：' + m.label);
    b.title = (i+1) + ' · ' + m.label;
    b.addEventListener('click', function(){ go(i); });
    li.appendChild(b); ticks.appendChild(li);
  });
  var tickBtns = [].slice.call(ticks.querySelectorAll('button'));
  document.getElementById('tot').textContent = ('0'+N).slice(-2);

  var prev = document.getElementById('prev'),
      next = document.getElementById('next'),
      num  = document.getElementById('num'),
      bar  = document.getElementById('dkbar');

  /* ---------- 滚动定位：取最接近可视区中心的一节为当前节 ---------- */
  function setCur(i){
    if(i === cur) return;
    cur = i;
    document.body.dataset.theme = META[i].theme;
    document.body.style.background = META[i].bg;
    bar.style.setProperty('--bar-bg', META[i].bg);
    num.textContent = ('0'+(i+1)).slice(-2);
    tickBtns.forEach(function(b,k){
      if(k===i) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current');
    });
    prev.disabled = (i===0);
    next.disabled = (i===N-1);
  }

  var pending = false;
  function onScroll(){
    if(pending) return;
    pending = true;
    requestAnimationFrame(function(){
      pending = false;
      var mid = (window.innerHeight - 64) / 2, best = 0, bestD = Infinity;
      slides.forEach(function(s,i){
        var r = s.getBoundingClientRect();
        var d = Math.abs((r.top + r.bottom)/2 - mid);
        if(d < bestD){ bestD = d; best = i; }
      });
      setCur(best);
    });
  }
  addEventListener('scroll', onScroll, {passive:true});
  addEventListener('resize', onScroll);

  function go(i){
    i = Math.max(0, Math.min(N-1, i));
    slides[i].scrollIntoView({behavior:'smooth', block:'start'});
  }

  /* ---------- 入场动效：滚动进入视口时播放 ---------- */
  function play(i){
    var fn = (window.__plays||{})[slides[i].id];
    if(fn) fn();
  }
  /* 每节只在首次进入视口时播放一次：回头重看时内容不会再淡出重来，
     需要重播用控制条的重播键或 R。 */
  try{
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting) return;
        var i = slides.indexOf(e.target);
        if(i < 0) return;
        io.unobserve(e.target);
        play(i);
      });
    }, {threshold:0.2});
    slides.forEach(function(s){ io.observe(s); });
  }catch(err){
    slides.forEach(function(s,i){ play(i); });
  }

  prev.addEventListener('click', function(){ go(cur-1); });
  next.addEventListener('click', function(){ go(cur+1); });
  document.getElementById('replay').addEventListener('click', function(){ play(cur); });

  var fs = document.getElementById('fs');
  if(!document.fullscreenEnabled){ fs.style.display='none'; }
  fs.addEventListener('click', function(){
    try{
      if(document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }catch(e){}
  });

  document.addEventListener('keydown', function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    var k = e.key;
    if(k==='ArrowRight'){ e.preventDefault(); go(cur+1); }
    else if(k==='ArrowLeft'){ e.preventDefault(); go(cur-1); }
    else if(k==='r'||k==='R'){ e.preventDefault(); play(cur); }
    else if(k==='f'||k==='F'){ e.preventDefault(); fs.click(); }
  });

  onScroll();
  window.__ready = true;
})();
</script>

</body>
</html>
