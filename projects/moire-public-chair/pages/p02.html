<header><h1>1. Overview: Two Chairs, One Image</h1><p class="lede">Two identical steel chairs face each other with a 0.6 m offset. Neither backrest shows an image on its own; when a line of sight passes through both, a pattern appears and shifts as the viewer walks.</p></header>
