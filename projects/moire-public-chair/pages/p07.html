<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>6. The Chair</title><style>
:root { --ink: #1E1E1E; --g1: #555555; --g2: #8C8C8C; --g3: #BDBDBD; --g4: #E6E6E6; --red: #D9532B;
  --serif: "Times New Roman", Times, "Liberation Serif", serif;
  --t-title: 30px; --t-lede: 16px; --t-label: 14px; --t-lead: 22px; --t-body: 14px; --t-data: 13px; --t-cap: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #F2F2F2; overflow: hidden; }
body { font-family: var(--serif); color: var(--ink); }
#fit { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.sheet { width: 1920px; height: 1080px; background: #fff; padding: 150px 56px 30px 150px; display: grid; grid-template-rows: auto 1fr; row-gap: 18px; }
h1 { margin: 0; font-size: var(--t-title); font-weight: bold; }
.lede { margin: 6px 0 0; font-size: var(--t-lede); color: var(--g1); }
.rule { border-top: 1.4px solid var(--ink); padding-top: 14px; min-height: 0; }
figure { margin: 0; }
figure img, figure video { display: block; width: 100%; }
figcaption { font-size: var(--t-cap); color: var(--g1); margin-top: 5px; line-height: 1.35; }
figcaption b { color: var(--ink); }
.label { margin: 0 0 8px; font-size: var(--t-label); font-weight: bold; letter-spacing: 0.06em; text-transform: uppercase; color: var(--g1); }
.label .n { color: var(--red); margin-right: 8px; }
.lead { margin: 0 0 8px; font-size: var(--t-lead); line-height: 1.3; }
.small { margin: 0; font-size: var(--t-body); line-height: 1.5; color: var(--g1); }
.blk { padding: 0 0 18px; margin-bottom: 18px; border-bottom: 0.6px solid var(--g4); }
.blk:last-child { border-bottom: 0; margin-bottom: 0; }
.tag { position: absolute; left: 10px; top: 8px; font-size: var(--t-data); color: var(--ink); background: rgba(255,255,255,.85); padding: 1px 6px; }
.rel { position: relative; }

.media { position: relative; background: #E6E6E6; overflow: hidden; }
.media video, .media img { width: 100%; height: 100%; object-fit: cover; display: block; }

.pair { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
.pair img { width: 100%; height: 640px; object-fit: cover; display: block; }
</style></head>
<body><div id="fit"><div class="sheet">
<header><h1>6. The Chair</h1><p class="lede">One folded steel sheet and two thin tubes: light enough to read as a line in the street, stiff enough to lean on.</p></header>
<div class="rule"><div class="pair">
  <figure class="rel"><img src="../assets/ch6_a.jpg" data-full="../assets/ch6_a.jpg" alt="" style="object-position:55% 50%"><span class="tag">a</span></figure>
  <figure class="rel"><img src="../assets/ch6_c.jpg" data-full="../assets/ch6_c.jpg" alt="" style="object-position:45% 50%"><span class="tag">c</span></figure>
</div><figcaption style="margin-top:8px"><b>Figure 7.</b> Chair A in monochrome. (a) Three-quarter view: the back carries the front-layer grating, while seat and legs stay solid. (b) Side elevation, shown full-screen above. (c) Seat and brace from the front. Click an image to see it in full.</figcaption></div>
</div></div><script>(() => { const f = document.getElementById('fit');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); f.style.transform = `scale(${s})`;
    f.style.left = `${(innerWidth - 1920 * s) / 2}px`; f.style.top = `${(innerHeight - 1080 * s) / 2}px`; };
  addEventListener('resize', fit); fit(); })();</script><style id="anim">
html, body { background: #fff !important; }
.js-anim .rule, .js-anim .col, .js-anim .text, .js-anim .figs, .js-anim .row2 { position: relative; border-top-color: transparent !important; }
.js-anim .rule::before, .js-anim .col::before, .js-anim .text::before, .js-anim .figs::before, .js-anim .row2::before {
  content: ""; position: absolute; left: 0; top: -1.4px; height: 1.4px; width: 100%; background: #1E1E1E;
  transform: scaleX(0); transform-origin: 0 0; transition: transform .7s cubic-bezier(.2,.7,.2,1); }
.js-anim.in .rule::before, .js-anim.in .col::before, .js-anim.in .text::before, .js-anim.in .figs::before, .js-anim.in .row2::before { transform: scaleX(1); }
.js-anim [data-a] { opacity: 0; transform: translateY(12px); transition: opacity .5s ease, transform .5s ease; }
.js-anim.in [data-a] { opacity: 1; transform: none; }
</style>
<script>
(function () {
  var root = document.documentElement;
  if (window === window.parent) return;
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!still) root.classList.add('js-anim');
  var sel = 'header > *, .label, .lead, .small, .q, .note, .formula, .decide, figure, table, .types, .lay, .stage, .plates, .ctl, .read, .grp, .step, .tag, .media';
  var i = 0;
  document.querySelectorAll(sel).forEach(function (el) {
    if (el.parentElement && el.parentElement.closest('[data-a]')) return;
    el.setAttribute('data-a', ''); el.style.transitionDelay = Math.min(i++ * 70, 1000) + 'ms';
  });
  document.querySelectorAll('img[data-full]').forEach(function (im) {
    im.style.cursor = 'zoom-in';
    im.addEventListener('click', function () { window.parent.postMessage({ lb: new URL(im.dataset.full, location.href).href, cap: im.dataset.cap || '' }, '*'); });
  });
  window.addEventListener('message', function (e) {
    var vids = document.querySelectorAll('video');
    if (e.data === 'in') { root.classList.add('in'); vids.forEach(function (v) { var p = v.play && v.play(); if (p && p.catch) p.catch(function () {}); }); }
    if (e.data === 'out') vids.forEach(function (v) { v.pause(); });
  });
})();
</script></body></html>
