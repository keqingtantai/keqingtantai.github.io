  <header class="hd">
    <h1 class="a">10. Use</h1>
    <p class="lede a">Push, brake, sit and carry use the controls a cyclist already knows.</p>
    <div class="rule"></div>
  </header>
  <div class="ct">
    <figure class="fig" style="height:100%">
      <div class="ug">
        <div class="uc a"><div class="fbox white contain"><img src="../assets/use-1-push.png" alt="Push and steer" data-full="../assets/use-1-push.png"><span class="tag">a</span></div><div class="ut"><b></b>Push and steer</div><p class="body">Hold both grips. The front casters swivel; the fixed rear casters keep the walker tracking straight.</p></div>
        <div class="uc a"><div class="fbox white contain"><img src="../assets/use-2-brake.png" alt="Brake" data-full="../assets/use-2-brake.png"><span class="tag">b</span></div><div class="ut"><b></b>Brake</div><p class="body">Squeeze the original brake levers. Each cable pulls a lever-arm brake against a rear caster tyre.</p></div>
        <div class="uc a"><div class="fbox white contain"><img src="../assets/use-3-sit.png" alt="Sit and lean back" data-full="../assets/use-3-sit.png"><span class="tag">c</span></div><div class="ut"><b></b>Sit and lean back</div><p class="body">Brake, turn round and sit on the 520 mm plywood seat. The bike saddle, mounted upside down on the seat post, becomes the backrest.</p></div>
        <div class="uc a"><div class="fbox white contain"><img src="../assets/use-4-carry.png" alt="Carry" data-full="../assets/use-4-carry.png"><span class="tag">d</span></div><div class="ut"><b></b>Carry</div><p class="body">Two Hello baskets hang either side of the frame, low and between the wheels, so a load lowers the centre of gravity.</p></div>
